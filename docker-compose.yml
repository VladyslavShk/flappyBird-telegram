
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flappy
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  game-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: always
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/server:/usr/src/app

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: always
    env_file: .env
    depends_on:
      - game-server
    volumes:
      - ./apps/bot:/usr/src/app

  webapp:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - game-server

volumes:
  pg_data:
